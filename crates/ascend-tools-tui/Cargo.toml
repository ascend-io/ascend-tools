[package]
name = "ascend-tools-tui"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Cody <cody.peterson@ascend.io>"]
license = "MIT"
description = "Interactive TUI for the Ascend Instance web API"
repository = "https://github.com/ascend-io/ascend-tools"
homepage = "https://github.com/ascend-io/ascend-tools"
readme = "README.md"

[lib]
name = "ascend_tools_tui"
path = "src/lib.rs"

[dependencies]
ascend-tools-core = { version = "1.0.0", path = "../ascend-tools-core" }
anyhow = "1"
serde_json = "1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
arboard = "3"
pulldown-cmark = { version = "0.13", default-features = false }
# Minimal features: bundled syntaxes + themes + fancy-regex (no html, plist, yaml, dump-create).
# Bundled syntax/theme data adds ~1.5 MB to the binary; a custom dump could reduce this.
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
unicode-width = "0.2"
