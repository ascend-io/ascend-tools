<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascend Tools</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --chat-user-bg: #4a90d9;
      --chat-user-fg: #fff;
      --chat-assist-bg: #f0f0f0;
      --chat-assist-fg: #1a1a1a;
      --chat-border: #ddd;
      --toolbar-bg: #f8f8f8;
    }
    [data-theme="dark"] {
      --chat-user-bg: #3b6fa0;
      --chat-user-fg: #fff;
      --chat-assist-bg: #2a2a2a;
      --chat-assist-fg: #e0e0e0;
      --chat-border: #444;
      --toolbar-bg: #1e1e1e;
    }

    body { padding-top: 0.5rem; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    header h1 { margin: 0; font-size: 1.4rem; }

    /* Tab bar */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--chat-border);
      padding-bottom: 0;
    }
    .tabs button {
      background: none;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--pico-muted-color);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tabs button:hover { color: var(--pico-color); }
    .tabs button.active {
      color: var(--pico-primary);
      border-bottom-color: var(--pico-primary);
    }

    /* Pages */
    .page { display: none; }
    .page.active { display: block; }

    /* Otto toolbar */
    .otto-toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 0.75rem;
      align-items: end;
      padding: 0.75rem;
      background: var(--toolbar-bg);
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    .otto-toolbar label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--pico-muted-color);
      margin-bottom: 0.25rem;
    }
    .otto-toolbar select, .otto-toolbar button {
      margin-bottom: 0;
      font-size: 0.85rem;
      padding: 0.4rem 0.6rem;
      height: auto;
    }
    .otto-toolbar button {
      white-space: nowrap;
    }

    /* Chat area */
    #chat-messages {
      height: calc(100vh - 340px);
      min-height: 300px;
      overflow-y: auto;
      padding: 1rem;
      border: 1px solid var(--chat-border);
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    #chat-messages:empty::before {
      content: 'Start a conversation with Otto...';
      color: var(--pico-muted-color);
      font-style: italic;
      display: block;
      text-align: center;
      padding-top: 4rem;
    }

    .msg { margin-bottom: 1rem; display: flex; }
    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .msg .bubble {
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user .bubble {
      background: var(--chat-user-bg);
      color: var(--chat-user-fg);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .bubble {
      background: var(--chat-assist-bg);
      color: var(--chat-assist-fg);
      border-bottom-left-radius: 4px;
    }
    .msg.assistant .bubble.streaming::after {
      content: '\25CF';
      animation: blink 1s steps(1) infinite;
      margin-left: 2px;
      color: var(--pico-primary);
    }
    @keyframes blink { 50% { opacity: 0; } }
    .msg.assistant .bubble.error { color: #c0392b; }

    /* Chat input */
    .chat-input-row {
      display: flex;
      gap: 0.5rem;
    }
    .chat-input-row input {
      flex: 1 1 auto;
      width: auto;
      margin-bottom: 0;
    }
    .chat-input-row button {
      flex: 0 0 auto;
      width: auto;
      margin-bottom: 0;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    /* Browse tables */
    #content { min-height: 200px; }
    #detail { margin-top: 1rem; }
    tbody tr[data-clickable] { cursor: pointer; transition: background 0.1s; }
    tbody tr[data-clickable]:hover { background: var(--toolbar-bg); }
    p.error { color: #c0392b; }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Ascend Tools</h1>
    </header>

    <div class="tabs">
      <button class="active" onclick="showPage('otto', this)">Otto</button>
      <button onclick="showPage('workspaces', this)">Workspaces</button>
      <button onclick="showPage('deployments', this)">Deployments</button>
      <button onclick="showPage('environments', this)">Environments</button>
      <button onclick="showPage('projects', this)">Projects</button>
    </div>

    <!-- Otto -->
    <section id="page-otto" class="page active">
      <div class="otto-toolbar">
        <div>
          <label for="otto-workspace">Workspace</label>
          <select id="otto-workspace"><option value="">None</option></select>
        </div>
        <div>
          <label for="otto-provider">Provider</label>
          <select id="otto-provider"><option value="">Default</option></select>
        </div>
        <div>
          <label for="otto-model">Model</label>
          <select id="otto-model"><option value="">Default</option></select>
        </div>
        <div>
          <button class="outline secondary" onclick="newConversation()">New Chat</button>
        </div>
      </div>
      <div id="chat-messages"></div>
      <form class="chat-input-row" onsubmit="sendMessage(event)">
        <input type="text" id="chat-input" placeholder="Ask Otto anything..." autocomplete="off" autofocus>
        <button type="submit" id="chat-send">Send</button>
      </form>
    </section>

    <!-- Browse pages -->
    <section id="page-workspaces" class="page">
      <div id="content-workspaces" hx-get="/api/workspaces" hx-trigger="intersect once" hx-swap="innerHTML"></div>
      <div id="detail"></div>
    </section>
    <section id="page-deployments" class="page">
      <div id="content-deployments" hx-get="/api/deployments" hx-trigger="intersect once" hx-swap="innerHTML"></div>
    </section>
    <section id="page-environments" class="page">
      <div id="content-environments" hx-get="/api/environments" hx-trigger="intersect once" hx-swap="innerHTML"></div>
    </section>
    <section id="page-projects" class="page">
      <div id="content-projects" hx-get="/api/projects" hx-trigger="intersect once" hx-swap="innerHTML"></div>
    </section>
  </main>

  <script>
    function showPage(name, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
      document.getElementById('page-' + name).classList.add('active')
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      if (name === 'otto') document.getElementById('chat-input').focus()
    }

    // --- Otto ---
    let threadId = null
    let isStreaming = false
    let providers = []

    async function initOtto() {
      try {
        const [wsRes, provRes] = await Promise.all([
          fetch('/api/otto/workspaces'),
          fetch('/api/otto/providers'),
        ])
        const workspaces = await wsRes.json()
        providers = await provRes.json()

        const wsSel = document.getElementById('otto-workspace')
        for (const ws of workspaces) wsSel.add(new Option(ws.title, ws.title))

        const provSel = document.getElementById('otto-provider')
        for (const p of providers) provSel.add(new Option(p.name, p.id))
        provSel.addEventListener('change', updateModels)
        updateModels()
      } catch (e) {
        console.error('Init failed:', e)
      }
    }

    function updateModels() {
      const provId = document.getElementById('otto-provider').value
      const modelSel = document.getElementById('otto-model')
      modelSel.innerHTML = '<option value="">Default</option>'
      const prov = providers.find(p => p.id === provId)
      if (prov) for (const m of prov.models) modelSel.add(new Option(m.name, m.id))
    }

    function newConversation() {
      threadId = null
      document.getElementById('chat-messages').innerHTML = ''
      document.getElementById('chat-input').focus()
    }

    function esc(s) {
      if (s == null) return ''
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function addMsg(role, text) {
      const el = document.createElement('div')
      el.className = 'msg ' + role
      el.innerHTML = `<div class="bubble">${esc(text)}</div>`
      document.getElementById('chat-messages').appendChild(el)
      scrollChat()
      return el
    }

    function addStreamBubble() {
      const el = document.createElement('div')
      el.className = 'msg assistant'
      el.innerHTML = '<div class="bubble streaming"></div>'
      document.getElementById('chat-messages').appendChild(el)
      scrollChat()
      return el.querySelector('.bubble')
    }

    function scrollChat() {
      const el = document.getElementById('chat-messages')
      el.scrollTop = el.scrollHeight
    }

    async function sendMessage(e) {
      e.preventDefault()
      const input = document.getElementById('chat-input')
      const prompt = input.value.trim()
      if (!prompt || isStreaming) return

      input.value = ''
      addMsg('user', prompt)

      const bubble = addStreamBubble()
      const btn = document.getElementById('chat-send')
      btn.disabled = true
      btn.textContent = 'Sending...'
      isStreaming = true

      try {
        const res = await fetch('/api/otto/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            workspace: document.getElementById('otto-workspace').value || undefined,
            provider: document.getElementById('otto-provider').value || undefined,
            model: document.getElementById('otto-model').value || undefined,
            threadId: threadId || undefined,
          }),
        })

        const reader = res.body.getReader()
        const decoder = new TextDecoder()
        let buf = '', full = ''

        while (true) {
          const { done, value } = await reader.read()
          if (done) break
          buf += decoder.decode(value, { stream: true })
          const lines = buf.split('\n')
          buf = lines.pop()

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i]
            if (!line.startsWith('event: ')) continue
            const evt = line.slice(7)
            const dl = lines[i + 1]
            if (!dl || !dl.startsWith('data: ')) continue
            const data = JSON.parse(dl.slice(6))
            i++

            if (evt === 'delta') { full += data; bubble.textContent = full; scrollChat() }
            else if (evt === 'done') { threadId = data.thread_id }
            else if (evt === 'error') { full += '\n\nError: ' + data; bubble.textContent = full; bubble.classList.add('error') }
          }
        }
        bubble.classList.remove('streaming')
      } catch (err) {
        bubble.textContent = 'Error: ' + err.message
        bubble.classList.add('error')
        bubble.classList.remove('streaming')
      } finally {
        isStreaming = false
        btn.disabled = false
        btn.textContent = 'Send'
        input.focus()
      }
    }

    initOtto()
  </script>
</body>
</html>
