name: Setup
description: Checkout, install Python + Node, restore cache, and run bin/setup

inputs:
  cache-prefix:
    description: Cache key prefix
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/uv
          target
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'uv.lock') }}
        restore-keys: ${{ inputs.cache-prefix }}-${{ runner.os }}-
    - run: bin/setup
      shell: bash
